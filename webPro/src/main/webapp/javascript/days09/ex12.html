    3. 프롬프트 상자(입력상자)             
  </xmp>

<button>종료</button>
<script>
  $("button").on("click", function() {
    let msg = " 정말 종료하시겠습니까 ? "
    if ( confirm( msg )) {
      self.close();
    }
  })
</script>
<script>
  message = "나이를 입력하세요";

  let result = prompt( message , age );
  
  alert(result)
</script>
