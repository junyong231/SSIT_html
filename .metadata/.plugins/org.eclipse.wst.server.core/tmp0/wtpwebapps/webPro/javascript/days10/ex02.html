<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
<link rel="shortcut icon" type="image/x-icon" href="http://localhost/webPro/images/SiSt.ico">
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="http://localhost/webPro/resources/cdn-main/example.css">
<script src="http://localhost/webPro/resources/cdn-main/example.js"></script>
</head>
<style>
 span.material-symbols-outlined{
    vertical-align: text-bottom;
 }  
</style>
<body>
<header>
  <h1 class="main"><a href="#" style="position: absolute;top:30px;">JYP ent</a></h1>
  <ul>
    <li><a href="#">로그인</a></li>
    <li><a href="#">회원가입</a></li>
  </ul>
</header>
<div>
  <xmp class="code">
    쿠키 생성
    쿠키 수정
    쿠키 삭제
    쿠키값 조회
    
    js 쿠키 : document.cookie 속성 사용

    ( 참고 )
    일부 브라우저에서는 _path 설정하지 않으면 삭제 허용 않는 경우도 있음

  </xmp>
  쿠키이름 : <input type="text" id="cookieName" autofocus> <br><br>
  쿠키 값: <input type="text" id="cookieValue"><br><br>
  <button onclick="setCookie()">쿠키 생성</button>
  <button onclick="getAllCookies()">쿠키 조회</button>
  <button onclick="getCookie()">쿠키 확인</button>
  <button onclick="deleteCookie()">쿠키 삭제</button>
  <br><br>
  <p id="demo"></p>
</div> 

<script>
  function setCookie(){
    let cname = $("#cookieName").val();
    let cvalue = $("#cookieValue").val();

    // js escape() / unescape() 함수
    // 한글 홍길동은 %uXXXX 로 치환됨 %uD64D %uAE38 %uB3D9
    // $("#demo").html(escape(cvalue));

    let now = new Date();
    now.setDate( now.getDate() + 10 );
    let expires = now.toUTCString();

    //쿠키 저장
    document.cookie = `${cname}=${escape(cvalue)}; expires=${expires}; path=/;`;

    // 주소창에 days09/ex01로 이동해도 쿠키 남아있음..

    //입력받은 값 초기화
    $("#cookieName").val("");
    $("#cookieValue").val("");

  }

  //id=admin; age=20
  function getAllCookies() {
    let cookies = document.cookie;
    $("#demo").html(cookies)

  }

  function getCookie() {
    let cookies = document.cookie;
    let cname = $("#cookieName").val();
    let cvalue;

    let pattern = /;\s/;
    let cookieArr = cookies.split(pattern);
    cookieArr.forEach(function (elem, i, array){
      let cnvArr = elem.split("=");
      if (cnvArr[0] == cname) {
        cvalue = unescape(cnvArr[1]);
        // break;  forEach문 쓰면 break 못씀. for of 됨
      }
    })
      if (cvalue) {
        $("#cookieValue").val( cvalue );
      }else {
        alert("존재하지 않는다")
      }



// 내가 하던거
    // getAllCookies();
    // let ckn = $("#demo").text().split(";");
    // let ckn2 = $("#demo").text().split("=");
    


  }

  function deleteCookie() {
    // 1. 만료 시점을 설정하지 않으면 세션이 끊어질 때 자동 삭제 (브라우저 닫을 때)
    // 2. 만료 시점이 지난 경우에는 쿠키 삭제.
    //    만료 시점 + 10일 => 만료 시점을 과거로 생각해서 다시 쿠키 생성 시 쿠키 삭제됨

    let cname = $("#cookieName").val();

    let now = new Date();
    now.setDate( now.getDate() - 10 ); // 현재 시스템 시간의 과거이기만 하면됨
    let expires = now.toUTCString();

    //쿠키 저장( 과거 만기일)
    document.cookie = `${cname}=; expires=${expires}; path=/;`;


    //입력받은 값 초기화
    $("#cookieName").val("");
    $("#cookieValue").val("");
  }
</script>
</body>
</html>
