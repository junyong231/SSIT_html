<script>
  // 원래 jsp jdbc DB연동해서 select + AJAX + JSON 처리 해야함..
  let data = [
    {type:"success",  message:"Lorem ipsum dolor sit amet, consectetur adipisicing."},
    {type:"warning", message:"Lorem ipsum dolor sit amet, consectetur adipisicing."},
    {type:"info", message:"Lorem ipsum dolor sit amet, consectetur adipisicing."},
    {type:"success", message:"Lorem ipsum dolor sit amet, consectetur adipisicing."}
    //원래 이 부분이 DB 연동 등등 필요함 지금은 배열로 
  ];

  for (const notice of data) {
    // console.log( notice.type + " / " + notice.message  )
    let newNotice = document.createElement('div')
    let htmls = `<div class="alert ${notice.type}"> <span class="closebtn">&times;</span>
     <strong> ${notice.type.toUpperCase()} !</strong>
     ${notice.message}</div>`;
    newNotice.innerHTML = htmls;

    document.querySelector("div:first-of-type").appendChild(newNotice)
    
  }

</script>

<script>


  $("button").on("click", function(){
    let type = $("option:selected").val();
    let msg = $("input").val();
    addNotice(type, msg);
    
  })

  function addNotice(type, msg) {
    if ( type == "type 없음") {
      alert("타입을 선택하세요")
      return;
    }
    let newNotice = document.createElement('div')
    let htmls = `<div class="alert ${type}"> <span class="closebtn">&times;</span>
     <strong> ${type.toUpperCase()} !</strong>
     ${msg}</div>`;
    newNotice.innerHTML = htmls;

    let parent = document.querySelector("hr");
    parent.after(newNotice)


    // newNotice > span.closebtn 에다가 클릭이벤트 걸어주는 코드가 필요
    // 아니면 새로 생긴 div들은 이벤트 안걸려있음..
    $(".closebtn").on("click" , function() {
    const parentDiv = $(this).parent();

    parentDiv.css("opacity" , "0");
    setTimeout(()=>{
      parentDiv.hide();
    }, 600)
    });
  }
</script>

<script>
  // $(".closebtn").on("click", function() {

  $(".closebtn").on("click" , function() {
    const parentDiv = $(this).parent();

    parentDiv.css("opacity" , "0");
    //타임아웃 안하면 바로 삭제됨 600으로 0.6초 텀주고 하이드되도록 만들기
    setTimeout(()=>{
      parentDiv.hide();
    }, 600)

  })
</script>
